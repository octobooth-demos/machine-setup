name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate config.json structure
        run: |
          jq -e '
            (.shared.vscode_theme | type == "string") and
            (.shared.vs_code_extensions | type == "array") and
            (.shared.gh_cli_extensions | type == "array") and
            (.shared.pwa_sites | type == "array") and
            (.shared.demo_sites | type == "array") and
            (.shared.mcp_servers | type == "array") and
            (.shared.repos_to_clone | type == "array") and
            (.mac.packages.casks | type == "array") and
            (.mac.packages.formulas | type == "array") and
            (.mac.editors | type == "array") and
            (.mac.post_install_launch | type == "array") and
            (.windows.packages | type == "array") and
            (.windows.editors | type == "array") and
            (.windows.post_install_launch | type == "array")
          ' config.json > /dev/null

  lint-bash:
    name: Lint bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint setup.sh
        run: shellcheck --severity=warning setup.sh
      - name: Parse setup.sh
        run: bash -n setup.sh

  test-bash:
    name: Test bash
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: brew install bats-core jq
      - name: Run Bats
        run: bats tests/bash

  lint-powershell:
    name: Lint PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Repository PSGallery
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path .\setup.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
      - name: Parse setup.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  test-powershell:
    name: Test PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -Repository PSGallery
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester -Path .\tests\powershell -CI
